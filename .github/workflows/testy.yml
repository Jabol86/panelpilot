name: Testy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integracja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install pytest-homeassistant-custom-component home-assistant-frontend
      - run: pip freeze | grep -i -E "^(homeassistant|pytest-homeassistant|home-assistant-frontend)"
      - run: python -m pytest tests -q -o asyncio_mode=auto --tb=short
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      # Kompilacja kontrolna, podpisana kluczem debug. Wydania są podpisywane stałym kluczem poza GitHubem.
      - run: gradle -p android :app:assembleRelease --console=plain
