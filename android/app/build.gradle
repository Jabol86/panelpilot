plugins { id 'com.android.application' }

android {
    namespace 'pl.panelpilot.app'
    compileSdk 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'pl.panelpilot.app'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.1.3'
    }
    // Klucz podpisu: plik keystore.properties obok (nie publikuj go). Bez niego używany jest klucz debug.
    def props = new Properties()
    def propsFile = rootProject.file('keystore.properties')
    if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
    signingConfigs {
        if (propsFile.exists()) {
            release {
                storeFile rootProject.file(props['storeFile'])
                storePassword props['password']
                keyAlias props['alias']
                keyPassword props['password']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig propsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { checkReleaseBuilds false }
}
